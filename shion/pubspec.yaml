name: shion
description: "SHION connected environmental app"
publish_to: 'none'
version: 1.0.0+5

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  image_picker: ^1.1.2
  flutter_secure_storage: ^11.2.0
  camera: ^0.11.2
  http: ^1.6.0
  geolocator: ^14.0.2
  latlong2: ^0.9.1
  url_launcher: ^6.3.2
  flutter_svg: ^2.2.0
  flutter_markdown_plus: ^1.0.12
  qr_flutter: ^4.1.0
  mobile_scanner: ^7.4.2
  permission_handler: ^13.0.2
  video_player: ^2.14.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/vector/
    - assets/icons/

  fonts:
    - family: Cormorant
      fonts:
        - asset: assets/fonts/CormorantGaramond.ttf
    - family: Manrope
      fonts:
        - asset: assets/fonts/Manrope.ttf
    - family: Fraunces
      fonts:
        - asset: assets/fonts/Fraunces.ttf
